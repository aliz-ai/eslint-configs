name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The lockfile release-age check diffs against the base commit
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/recommended/package-lock.json
      - name: Check lockfile release age
        run: node scripts/check-lockfile-release-age.mjs packages/recommended/package-lock.json "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci
        working-directory: packages/recommended
      - run: npm test
        working-directory: packages/recommended
